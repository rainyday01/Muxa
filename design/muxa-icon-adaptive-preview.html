<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Muxa icon · Remote Link adaptive check</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #0a0a0c; color: #fafafa; padding: 24px; }
  h1 { font-size: 18px; }
  p { color: #a1a1aa; font-size: 13px; max-width: 56ch; }
  .row { display: flex; flex-wrap: wrap; gap: 28px; margin-top: 20px; }
  .cell { text-align: center; }
  .cell span { display: block; margin-top: 8px; font-size: 12px; color: #a1a1aa; }
  .frame {
    width: 180px; height: 180px; position: relative;
    background:
      linear-gradient(45deg,#222 25%,transparent 25%),
      linear-gradient(-45deg,#222 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#222 75%),
      linear-gradient(-45deg,transparent 75%,#222 75%);
    background-size: 16px 16px; background-position: 0 0,0 8px,8px -8px,-8px 0;
    background-color: #111; border-radius: 12px; display: grid; place-items: center;
  }
  .layer {
    width: 160px; height: 160px; position: relative;
    border-radius: 36px; overflow: hidden;
    box-shadow: 0 12px 32px rgba(0,0,0,.5);
  }
  .layer.circle { border-radius: 50%; }
  .layer.squircle { border-radius: 36px; }
  .layer svg { width: 100%; height: 100%; display: block; }
  .safe {
    position: absolute; inset: 17%; border: 1px dashed rgba(255,100,100,.7);
    border-radius: 50%; pointer-events: none;
  }
  code { background: #222; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
  <h1>Muxa · Remote Link 自适应预览</h1>
  <p>左：HTML 原图完整构图。中/右：与 APK 相同策略——背景铺满金属板，前景整组图形 <code>scale(0.72)</code> 居中，避免圆角/圆形蒙版裁切手机或服务器。</p>
  <div class="row">
    <div class="cell">
      <div class="frame">
        <div class="layer squircle">
          <img src="muxa-icon-remote-link.svg" width="160" height="160" alt="full"/>
        </div>
      </div>
      <span>商店示意 · 完整 HTML 构图</span>
    </div>
    <div class="cell">
      <div class="frame">
        <div class="layer squircle" id="ad-sq"></div>
      </div>
      <span>自适应 · 圆角矩形（安全区示意）</span>
    </div>
    <div class="cell">
      <div class="frame">
        <div class="layer circle" id="ad-ci"></div>
      </div>
      <span>自适应 · 圆形（更狠裁切）</span>
    </div>
  </div>
<script>
const adaptive = `
<svg viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3f4b"/>
      <stop offset="50%" stop-color="#1e222b"/>
      <stop offset="100%" stop-color="#0f1218"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" fill="url(#metal)"/>
  <g transform="translate(54,54) scale(0.72) translate(-54,-55)">
    <rect x="14" y="38" width="28" height="44" rx="5" fill="#1c1c1e" stroke="#8e8e93" stroke-width="1.5"/>
    <rect x="18" y="44" width="20" height="28" rx="2" fill="#0a84ff" opacity="0.35"/>
    <rect x="66" y="28" width="28" height="52" rx="4" fill="#2c2c2e" stroke="#aeaeb2" stroke-width="1.5"/>
    <rect x="70" y="34" width="20" height="6" rx="1" fill="#30d158"/>
    <rect x="70" y="44" width="20" height="3" rx="1" fill="#636366"/>
    <rect x="70" y="50" width="16" height="3" rx="1" fill="#636366"/>
    <path d="M42 58 C52 48, 56 68, 66 54" stroke="#0a84ff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="54" cy="56" r="3" fill="#0a84ff"/>
    <circle cx="54" cy="56" r="1.3" fill="#b6dcff"/>
  </g>
  <!-- safe zone guide -->
  <circle cx="54" cy="54" r="36" fill="none" stroke="rgba(255,80,80,0.55)" stroke-width="0.8" stroke-dasharray="2 2"/>
</svg>`;
document.getElementById('ad-sq').innerHTML = adaptive;
document.getElementById('ad-ci').innerHTML = adaptive;
</script>
</body>
</html>
