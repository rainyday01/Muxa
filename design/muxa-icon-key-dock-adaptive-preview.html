<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Muxa · Key Dock adaptive preview</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #0a0a0c; color: #fafafa; padding: 24px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { color: #a1a1aa; font-size: 13px; max-width: 60ch; }
  .row { display: flex; flex-wrap: wrap; gap: 28px; margin-top: 20px; }
  .cell { text-align: center; }
  .cell span { display: block; margin-top: 8px; font-size: 12px; color: #a1a1aa; }
  .frame {
    width: 180px; height: 180px; display: grid; place-items: center;
    background: #111; border-radius: 12px;
    background-image: linear-gradient(45deg,#222 25%,transparent 25%),linear-gradient(-45deg,#222 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#222 75%),linear-gradient(-45deg,transparent 75%,#222 75%);
    background-size: 16px 16px; background-position: 0 0,0 8px,8px -8px,-8px 0;
  }
  .layer { width: 160px; height: 160px; overflow: hidden; box-shadow: 0 12px 32px rgba(0,0,0,.5); position: relative; }
  .layer.sq { border-radius: 36px; }
  .layer.ci { border-radius: 50%; }
  .layer svg { width: 100%; height: 100%; display: block; }
  code { background: #222; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
  <h1>Muxa · Key Dock（HTML #09）自适应预览</h1>
  <p>左：HTML 原图完整构图。中/右：与 APK 相同——背景 <code>#1c1a17</code> 铺满；前景整组 <code>scale(0.72)</code> 居中，终端窗与键条比例与 HTML 一致，不被圆形蒙版裁掉。</p>
  <div class="row">
    <div class="cell">
      <div class="frame"><div class="layer sq"><img src="muxa-icon-key-dock.svg" width="160" height="160" alt="full"/></div></div>
      <span>HTML 原图 · 完整 108 构图</span>
    </div>
    <div class="cell">
      <div class="frame"><div class="layer sq" id="sq"></div></div>
      <span>APK 策略 · 圆角 + 安全区虚线</span>
    </div>
    <div class="cell">
      <div class="frame"><div class="layer ci" id="ci"></div></div>
      <span>APK 策略 · 圆形蒙版</span>
    </div>
  </div>
<script>
const svg = `
<svg viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg">
  <rect width="108" height="108" fill="#1c1a17"/>
  <g transform="translate(54,52) scale(0.72) translate(-54,-52)">
    <rect x="16" y="18" width="76" height="48" rx="8" fill="#141210"/>
    <path d="M28 36 L36 42 L28 48" stroke="#f0a060" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="42" y1="48" x2="56" y2="48" stroke="#e8dcc8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <g fill="#3a342b">
      <rect x="18" y="74" width="14" height="12" rx="3"/>
      <rect x="36" y="74" width="14" height="12" rx="3"/>
      <rect x="54" y="74" width="14" height="12" rx="3"/>
      <rect x="72" y="74" width="18" height="12" rx="3"/>
    </g>
    <g fill="#f0a060" font-family="system-ui,sans-serif" font-size="7" font-weight="700">
      <text x="21" y="83">esc</text>
      <text x="39" y="83">⌃</text>
      <text x="57" y="83">⌥</text>
      <text x="76" y="83">⋯</text>
    </g>
  </g>
  <circle cx="54" cy="54" r="36" fill="none" stroke="rgba(255,80,80,0.5)" stroke-width="0.8" stroke-dasharray="2 2"/>
</svg>`;
document.getElementById('sq').innerHTML = svg;
document.getElementById('ci').innerHTML = svg;
</script>
</body>
</html>
