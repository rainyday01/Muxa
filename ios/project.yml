name: Muxa
options:
  bundleIdPrefix: app.mtmux
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  minimumXcodeGenVersion: 2.46.0

settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true
    CLANG_ENABLE_MODULES: true
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
    DEVELOPMENT_TEAM: 8AP2933NZH
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.15.0
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.11.1
  Valet:
    url: https://github.com/square/Valet.git
    exactVersion: 5.1.0

targets:
  Muxa:
    type: application
    platform: iOS
    sources:
      - path: Muxa
    resources:
      - path: Muxa/Resources
    dependencies:
      - framework: Vendor/Native/LibSSH2.xcframework
        embed: false
      - framework: Vendor/Native/OpenSSL.xcframework
        embed: false
      - package: SwiftTerm
      - package: GRDB
        product: GRDB
      - package: Valet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mtmux.ios
        PRODUCT_NAME: Muxa
        MARKETING_VERSION: 0.1.2
        CURRENT_PROJECT_VERSION: 5
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Muxa
        INFOPLIST_KEY_CFBundleDevelopmentRegion: en
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_NSFaceIDUsageDescription: Muxa uses Face ID to unlock the app.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsMultipleScenes: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: 1,2
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  MuxaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MuxaTests
        excludes:
          - Fixtures
      - path: MuxaTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Muxa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mtmux.ios.tests
        GENERATE_INFOPLIST_FILE: true

  MuxaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MuxaUITests
    dependencies:
      - target: Muxa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mtmux.ios.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Muxa

schemes:
  Muxa:
    build:
      targets:
        Muxa: all
        MuxaTests: [test]
        MuxaUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: MuxaTests
          parallelizable: true
        - name: MuxaUITests
          parallelizable: false
